<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
    <meta name="robots" content="noindex">
    <title>404 — BÖYLE BİR SAYFA HİÇ OLMADI</title>
    <meta name="theme-color" content="#020202">
    <style>
        /* Relative font URLs resolve for root-level misses (the common case) and fall back gracefully elsewhere. */
        @font-face { font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap; src: url('./assets/fonts/VT323-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
        @font-face { font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap; src: url('./assets/fonts/VT323-latin.woff2') format('woff2'); unicode-range: U+0000-00FF; }
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020202;
            color: #00ff41;
            font-family: 'VT323', 'Courier New', Courier, monospace;
            font-size: 20px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
            overflow: hidden;
        }
        .vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 20vw rgba(0, 0, 0, 0.92); }
        .scanlines { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 2px 3px); }
        main { position: relative; max-width: 42rem; padding: 2rem; text-align: center; }
        .code { font-size: clamp(4rem, 18vw, 9rem); line-height: 1; color: #ff2a2a; text-shadow: 0 0 12px #ff2a2a, 0 0 40px rgba(255, 42, 42, 0.5); letter-spacing: 0.1em; margin: 0; }
        h1 { font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: 0.08em; margin: 1rem 0 0.5rem; font-weight: 400; }
        p { margin: 0.4rem 0; color: #b0b0b0; line-height: 1.5; }
        p.en { color: #7a7a7a; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        a:hover, a:focus-visible { background: #00ff41; color: #020202; outline: none; }
        .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
</head>
<body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>İSTEDİĞİNİZ SAYFA MEVCUT DEĞİL.</h1>
        <p>İsteğiniz de mevcut değildi. Buraya nasıl geldiğiniz kaydedilmiştir.</p>
        <p class="en">The page you requested does not exist. Neither did your request. How you got here has been recorded.</p>
        <a id="home" href="./">&gt; ANA EKRANA DÖN / RETURN TO THE SCREEN<span class="cursor">_</span></a>
    </main>
    <script>
        // GitHub project pages live under /<repo>/; send the citizen back to the right root.
        (function () {
            var link = document.getElementById('home');
            var seg = location.pathname.split('/').filter(Boolean)[0];
            if (/github\.io$/.test(location.hostname) && seg) {
                link.setAttribute('href', '/' + seg + '/');
            } else {
                link.setAttribute('href', '/');
            }
        })();
    </script>
</body>
</html>
